# Test Configuration - H2 In-Memory Database
# This file is used when running tests and doesn't require .env file

# H2 In-Memory Database (for testing only)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Tomcat APR warning in tests
server.tomcat.apr.enabled=false

# H2 Console (useful for debugging tests)
spring.h2.console.enabled=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG

# Disable Swagger in tests (faster startup)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT Secret for tests (not sensitive, only for testing)
jwt.secret=test-secret-key-for-testing-only-do-not-use-in-production

# Email configuration for tests (mock or disabled)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test

# Application Base URL for tests
app.base.url=http://localhost:8080