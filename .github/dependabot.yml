version: 2
updates:
    - package-ecosystem: "maven"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
          - "security"
      assignees:
          - "samehinttech"
      reviewers:
          - "samehinttech"
      commit-message:
          prefix: "build"
          include: "scope"