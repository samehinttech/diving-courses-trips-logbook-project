version: 2
updates:
    - package-ecosystem: "maven"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "07:00"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
          - "security"
      assignees:
          - "samehinttech"
      reviewers:
          - "samehinttech"
      commit-message:
          prefix: "build"
          include: "scope"
          # Group similar updates to reduce PR noise
      groups:
          spring-framework:
              patterns:
                  - "org.springframework*"
          security:
              patterns:
                  - "org.springframework.security*"
                  - "ch.qos.logback*"
                  - "org.apache.commons*"
      ignore:
          - dependency-name: "com.h2database:h2"
            update-types: ["version-update:semver-major"]