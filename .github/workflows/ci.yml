name: CI

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
    schedule:
        - cron: '0 0 * * 1' # Weekly on Monday

jobs:
    build-and-test:
        if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
        name: Build & Test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: maven

            - name: Build with Maven
              run: mvn clean install -B -V

            - name: Run Tests
              run: mvn test -B

            - name: Generate Test Report
              if: always()
              uses: dorny/test-reporter@v1
              with:
                  name: Maven Tests
                  path: target/surefire-reports/*.xml
                  reporter: java-junit

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: target/surefire-reports/

            - name: Upload JAR
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: oceandive-jar
                  path: target/*.jar
                  retention-days: 7

    security-analysis:
        if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
        name: Security Analysis (CodeQL)
        runs-on: ubuntu-latest
        needs: build-and-test
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: [ 'java' ]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: maven

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: ${{ matrix.language }}
                  queries: security-extended,security-and-quality

            - name: Build for CodeQL
              run: mvn clean compile -DskipTests -B

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:${{matrix.language}}"

    code-quality:
        if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
        name: Code Quality (Qodana)
        runs-on: ubuntu-latest
        needs: build-and-test
        permissions:
            contents: write
            pull-requests: write
            checks: write
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: maven

            - name: Qodana Scan
              uses: JetBrains/qodana-action@v2024.3
              env:
                  QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
              with:
                  pr-mode: ${{ github.event_name == 'pull_request' }}
                  cache-default-branch-only: false
                  post-comment: true
                  use-annotations: true
                  upload-result: true
                  push-fixes: none
                  fail-threshold: 0

            - name: Upload Qodana Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: qodana-results
                  path: ${{ runner.temp }}/qodana/results/
                  retention-days: 14